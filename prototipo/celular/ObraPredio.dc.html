<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atlas · Acompanhar a obra (o prédio em primeiro plano)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{text-decoration:none}
@keyframes m08bpisca{0%,100%{opacity:1}50%{opacity:.35}} .m08b-ponto{animation:m08bpisca 1.2s infinite}
@media (prefers-reduced-motion: reduce){.m08b-ponto{animation:none}}</style>
</helmet>
<div style="width:390px;height:844px;background:#141619;color:#EDEFEA;font-family:'Geist',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden">
 <header style="padding:14px 16px 6px;display:flex;align-items:center;gap:10px">
  <a href="Main.dc.html" aria-label="Voltar para Minhas obras" style="width:44px;height:44px;border-radius:22px;background:#1E2125;display:flex;align-items:center;justify-content:center;color:#EDEFEA;flex:none">
   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
  <div style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0">
   <span style="font-size:17px;font-weight:700">Ponto</span>
   <span style="font-size:13px;color:#B4BBB2;display:flex;align-items:center;gap:6px"><span class="{{classePonto}}" style="{{estiloPonto}}"></span>{{situacao}}</span>
  </div>
 </header>
 <main style="flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px 12px;gap:12px">
  <section aria-label="O prédio da obra" style="position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#22303A 0%,#16191C 70%)">
   <img src="{{predio}}" alt="{{altPredio}}" style="position:absolute;left:0;right:0;bottom:0;width:100%;height:92%;object-fit:contain;object-position:center bottom">
   <div style="position:absolute;left:16px;top:14px;display:flex;flex-direction:column;gap:2px">
    <span style="font:700 46px/1 'Geist',sans-serif;letter-spacing:-.03em;color:#C6F135">{{pct}}%</span>
    <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.1em;color:#8E968C">{{andaresTxt}}</span>
   </div>
  </section>
  <div style="display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:#1E2125;border:1px solid #2C3036">
   <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.1em;color:#8E968C">ETAPA {{etapa}} DE {{total}}</span>
   <b style="font-size:17px;line-height:1.3">{{etapaNome}}</b>
   <span style="display:flex;gap:10px;font-size:14px;line-height:1.4;color:#B4BBB2"><span style="font:500 13px 'Geist Mono',monospace;color:#8E968C;flex:none">16h18</span>{{noticia}}</span>
  </div>
 </main>
 <footer style="padding:8px 16px 26px;display:flex;gap:10px">
  <button type="button" onClick="{{pausar}}" style="flex:1;height:52px;border-radius:12px;border:1px solid #2C3036;background:transparent;color:#EDEFEA;font:700 16px 'Geist',sans-serif;cursor:pointer">{{textoPausa}}</button>
  <button type="button" aria-label="Falar com o Atlas" style="height:52px;padding:0 18px;border-radius:12px;border:0;background:#C6F135;color:#141619;font:700 16px 'Geist',sans-serif;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap">
   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Falar com o Atlas</button>
 </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etapa":{"editor":"number","default":9},"total":{"editor":"number","default":12},"$preview":{"width":390,"height":844}}'>
function predioSvg({ andares = 8, prontos = 3, largura = 360, altura = 420 } = {}) {
  const n = Math.max(1, Math.min(20, andares)), p = Math.max(0, Math.min(n, prontos))
  const cx = largura / 2, base = altura - 70
  const dx = 92, dy = 53
  const fh = Math.min(30, (altura - 150) / n)
  const pt = (a) => a.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ')
  const out = []
  // lote
  out.push(`<polygon points="${pt([[cx, base + 38], [cx - dx - 46, base - dy + 12], [cx, base - 2 * dy - 14], [cx + dx + 46, base - dy + 12]])}" fill="#2B2118" stroke="#3A2E22"/>`)
  out.push(`<polygon points="${pt([[cx, base + 38], [cx - dx - 46, base - dy + 12], [cx, base - 2 * dy - 14], [cx + dx + 46, base - dy + 12]])}" fill="none" stroke="#C9B9A0" stroke-opacity=".35" stroke-width="2"/>`)
  // grua
  const gx = cx + dx + 22, gy = base - dy + 6, topo = base - n * fh - 70
  out.push(`<line x1="${gx}" y1="${gy}" x2="${gx}" y2="${topo}" stroke="#E0B83C" stroke-width="4"/>`)
  out.push(`<line x1="${gx - 90}" y1="${topo + 4}" x2="${gx + 40}" y2="${topo + 4}" stroke="#E0B83C" stroke-width="4"/>`)
  out.push(`<line x1="${gx - 70}" y1="${topo + 6}" x2="${gx - 70}" y2="${topo + 46}" stroke="#8E968C" stroke-width="1.5"/>`)
  out.push(`<rect x="${gx - 78}" y="${topo + 46}" width="16" height="10" fill="#C6F135"/>`)
  for (let i = 0; i < n; i++) {
    const y = base - i * fh
    const L = [[cx, y], [cx - dx, y - dy], [cx - dx, y - dy - fh], [cx, y - fh]]
    const R = [[cx, y], [cx + dx, y - dy], [cx + dx, y - dy - fh], [cx, y - fh]]
    if (i < p) {
      out.push(`<polygon points="${pt(L)}" fill="#2F343A"/><polygon points="${pt(R)}" fill="#24282D"/>`)
      for (const [face, s] of [[L, -1], [R, 1]]) for (let k = 0; k < 4; k++) {
        const t0 = 0.1 + k * 0.215, t1 = t0 + 0.13
        const acesa = ((i * 7 + k * 3 + (s > 0 ? 1 : 0)) % 5) !== 0
        const x0 = cx + s * dx * t0, x1 = cx + s * dx * t1
        const yb0 = y - dy * t0 - fh * 0.22, yb1 = y - dy * t1 - fh * 0.22
        const h = fh * 0.52
        out.push(`<polygon points="${pt([[x0, yb0], [x1, yb1], [x1, yb1 - h], [x0, yb0 - h]])}" fill="${acesa ? '#F2D27A' : '#3A3F45'}"/>`)
      }
      out.push(`<line x1="${cx - dx}" y1="${y - dy - fh}" x2="${cx}" y2="${y - fh}" stroke="#141619" stroke-opacity=".5"/><line x1="${cx}" y1="${y - fh}" x2="${cx + dx}" y2="${y - dy - fh}" stroke="#141619" stroke-opacity=".5"/>`)
      if (i === p - 1) { const yt = y - fh; out.push(`<polygon points="${pt([[cx, yt], [cx - dx, yt - dy], [cx, yt - 2 * dy], [cx + dx, yt - dy]])}" fill="#3A3F45" stroke="#141619" stroke-opacity=".4"/>`) }
    } else if (i === p) {
      out.push(`<polygon points="${pt(L)}" fill="#C6F135" fill-opacity=".14" stroke="#C6F135" stroke-width="1.5"/><polygon points="${pt(R)}" fill="#C6F135" fill-opacity=".08" stroke="#C6F135" stroke-width="1.5"/>`)
      const yt = y - fh; out.push(`<polygon points="${pt([[cx, yt], [cx - dx, yt - dy], [cx, yt - 2 * dy], [cx + dx, yt - dy]])}" fill="none" stroke="#C6F135" stroke-opacity=".7"/>`)
      for (let k = 1; k < 4; k++) { const t = k / 4; out.push(`<line x1="${cx - dx * t}" y1="${y - dy * t}" x2="${cx - dx * t}" y2="${y - dy * t - fh}" stroke="#C6F135" stroke-opacity=".6"/><line x1="${cx + dx * t}" y1="${y - dy * t}" x2="${cx + dx * t}" y2="${y - dy * t - fh}" stroke="#C6F135" stroke-opacity=".6"/>`) }
    } else {
      out.push(`<polygon points="${pt(L)}" fill="none" stroke="#5A6168" stroke-dasharray="4 4" stroke-opacity=".7"/><polygon points="${pt(R)}" fill="none" stroke="#5A6168" stroke-dasharray="4 4" stroke-opacity=".7"/>`)
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${largura} ${altura}">${out.join('')}</svg>`
}
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pausada: false }; }
  renderVals() {
    const total = Math.max(1, Number(this.props.total ?? 12)), etapa = Math.min(total, Math.max(1, Number(this.props.etapa ?? 9)));
    const prontos = etapa - 1, pct = Math.round(((prontos + 0.6) / total) * 100);
    const svg = predioSvg({ andares: total, prontos });
    const p = this.state.pausada;
    return {
      predio: 'data:image/svg+xml;utf8,' + encodeURIComponent(svg),
      altPredio: `O prédio: ${prontos} de ${total} andares prontos, o ${etapa}º em obra`,
      pct, etapa, total, andaresTxt: `ANDARES · ${prontos} DE ${total} PRONTOS`,
      etapaNome: 'Aprovar lançamentos e ajustar ponto', noticia: 'Trabalhando na tela de aprovar os lançamentos do dia.',
      situacao: p ? 'Pausada por você' : 'Construindo agora no notebook',
      classePonto: p ? '' : 'm08b-ponto', estiloPonto: 'width:8px;height:8px;border-radius:4px;flex:none;background:' + (p ? '#F2B14A' : '#C6F135'),
      textoPausa: p ? 'Continuar a obra' : 'Pausar', pausar: () => this.setState({ pausada: !p })
    };
  }
}
</script>
</body>
</html>
