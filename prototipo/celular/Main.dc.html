<head>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{color:#C6F135;text-decoration:none} a:hover{color:#d8ff5c}</style>
</helmet>
<div style="width: 390px; height: 844px; background: #141619; color: #EDEFEA; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box">
 <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px">
  <div style="display: flex; align-items: center; gap: 8px"><img src="/_blob/d75562038b21cd8e298dcfc0c04ef9cd" alt="" style="width: 34px; height: 19px; object-fit: contain"><img src="/_blob/a100dc4e2e64acf4a114194b3e713597" alt="Atlas" style="width: 84px; height: 13px; object-fit: contain"></div>
  <a href="Entrar.dc.html" aria-label="Minha conta" style="width: 40px; height: 40px; border-radius: 20px; background: #22262B; display: flex; align-items: center; justify-content: center; color: #EDEFEA; font: 600 15px 'Geist', sans-serif">Z</a>
 </header>
 <main style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; flex-direction: column; gap: 6px">
   <span style="font: 500 12px 'Geist Mono', monospace; letter-spacing: .12em; color: #8E968C">BOM DIA, ZÉ</span>
   <h1 style="margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em">Minhas obras</h1>
  </div>
  <a href="Desligado.dc.html" style="background: #1E2125; border: 1px solid #2C3036; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; color: #EDEFEA">
   <span style="width: 44px; height: 44px; border-radius: 22px; background: #2A3A12; display: flex; align-items: center; justify-content: center; flex: none">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C6F135" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M2 20h20"></path></svg>
   </span>
   <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1">
    <span style="font-size: 15px; font-weight: 600">Notebook do escritório</span>
    <span style="font-size: 13px; color: #B4BBB2; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #C6F135; flex: none"></span>Ligado · Atlas aberto · trabalhando</span>
   </span>
   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E968C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </a>
  <a href="Ideia.dc.html" style="background: #C6F135; color: #141619; border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 16px">
   <span style="width: 52px; height: 52px; border-radius: 26px; background: #141619; display: flex; align-items: center; justify-content: center; flex: none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C6F135" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
   </span>
   <span style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em">Começar uma obra nova</span>
    <span style="font-size: 14px; line-height: 1.4; color: #2C3A06">Conte a ideia falando. O notebook desenha as telas.</span>
   </span>
  </a>
  <div role="tablist" aria-label="Situação das obras" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
   <sc-for list="{{abas}}" as="a" hint-placeholder-count="4">
    <button type="button" role="tab" aria-selected="{{a.sel}}" onClick="{{a.pick}}" style="{{a.estilo}}">{{a.nome}} <span style="font-family: 'Geist Mono', monospace; opacity: .75">{{a.n}}</span></button>
   </sc-for>
  </div>
  <sc-for list="{{obras}}" as="o" hint-placeholder-count="2">
   <a href="{{o.link}}" style="background: #1E2125; border: 1px solid #2C3036; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; color: #EDEFEA">
    <span style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
     <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">{{o.nome}}</span>
      <span style="font-size: 13px; color: #B4BBB2">{{o.etapa}}</span>
     </span>
     <span style="font: 600 13px 'Geist Mono', monospace; padding: 6px 10px; border-radius: 999px; white-space: nowrap; {{o.seloEstilo}}">{{o.selo}}</span>
    </span>
    <span style="height: 6px; border-radius: 3px; background: #2A2E33; overflow: hidden; display: block"><span style="display: block; height: 6px; border-radius: 3px; background: #C6F135; width: {{o.pct}}"></span></span>
    <span style="display: flex; justify-content: space-between; font-size: 13px; color: #8E968C"><span>{{o.quando}}</span><span style="font-family: 'Geist Mono', monospace; color: #EDEFEA">{{o.pct}}</span></span>
   </a>
  </sc-for>
  <sc-if value="{{vazio}}" hint-placeholder-val="{{ false }}">
   <div style="border: 1px dashed #2C3036; border-radius: 18px; padding: 24px 18px; text-align: center; color: #B4BBB2; font-size: 14px; line-height: 1.5">{{textoVazio}}</div>
  </sc-if>
 </main>
 <nav aria-label="Menu" style="display: flex; justify-content: space-around; padding: 10px 12px 22px; border-top: 1px solid #2A2E33; background: #101214">
  <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: #C6F135; min-width: 72px; padding: 4px">
   <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V8l7-5 7 5v13M10 21v-6h4v6"></path></svg>Obras</a>
  <a href="Ideia.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: #B4BBB2; min-width: 72px; padding: 4px">
   <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nova obra</a>
  <a href="Obra.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: #B4BBB2; min-width: 72px; padding: 4px">
   <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"></path></svg>Avisos</a>
 </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { aba: 'andamento' }; }
  renderVals() {
    const lista = {
      andamento: [
        { nome: 'Agenda da Barbearia', etapa: 'Etapa 4 de 7 · Agenda e horários', selo: 'Construindo', seloEstilo: 'background:#2A3A12;color:#C6F135', pct: '62%', quando: 'Notícia nova há 8 min', link: 'Obra.dc.html' },
        { nome: 'Estoque da loja', etapa: 'Projeto · as telas estão prontas', selo: 'Sua vez', seloEstilo: 'background:#3A2C10;color:#F2B14A', pct: '20%', quando: 'Esperando você aprovar as telas', link: 'Prototipo.dc.html' }
      ],
      concluidas: [
        { nome: 'Orçamentos rápidos', etapa: 'No ar desde 12/11', selo: 'Pronta', seloEstilo: 'background:#22262B;color:#EDEFEA', pct: '100%', quando: 'Entregue em 12/11/2026', link: 'Obra.dc.html' }
      ],
      paradas: [],
      excluidas: []
    };
    const vazios = { paradas: 'Nenhuma obra parada. Se a cota do Claude acabar ou o notebook desligar, a obra aparece aqui e continua sozinha depois.', excluidas: 'Nenhuma obra excluída. Uma obra excluída fica aqui por 30 dias, caso você mude de ideia.' };
    const abas = [['andamento', 'Em andamento'], ['concluidas', 'Concluídas'], ['paradas', 'Paradas'], ['excluidas', 'Excluídas']].map(([id, nome]) => {
      const sel = this.state.aba === id;
      return { nome, n: String(lista[id].length), sel: sel ? 'true' : 'false', pick: () => this.setState({ aba: id }),
        estilo: 'height:38px;padding:0 14px;border-radius:999px;font:500 14px Geist,sans-serif;white-space:nowrap;cursor:pointer;flex:none;' + (sel ? 'background:#2A3A12;color:#C6F135;border:1px solid #C6F135' : 'background:transparent;color:#B4BBB2;border:1px solid #2C3036') };
    });
    const obras = lista[this.state.aba];
    return { abas, obras, vazio: obras.length === 0, textoVazio: vazios[this.state.aba] || '' };
  }
}
</script>
</body>
</html>
