<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atlas · Obra: Diário completo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div style="width:1440px;height:900px"><dc-import name="ObraEstado" estado="trabalhando" diario="{{ true }}" tema="{{tema}}" hint-size="1440px,900px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["escuro","claro"],"default":"escuro"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { tema: this.props.tema ?? 'escuro' }; }
}
</script>
</body>
</html>
