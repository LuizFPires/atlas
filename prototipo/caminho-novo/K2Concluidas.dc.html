<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atlas · Obras concluídas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{text-decoration:none}
.k-card{transition:transform .2s ease, box-shadow .2s ease}
.k-card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.35)}</style>
</helmet>
<div style="width:1440px;height:900px;background:{{t.bg}};color:{{t.text}};font-family:'Geist',system-ui,sans-serif;display:flex;overflow:hidden">
 <dc-import name="Shell" ativo="concluidas" tema="{{tema}}" hint-size="248px,900px"></dc-import>
 <main style="flex:1;min-width:0;box-sizing:border-box;padding:28px 36px;display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;align-items:flex-end;gap:16px">
   <div style="display:flex;flex-direction:column;gap:6px">
    <span style="font:500 12px 'Geist Mono',monospace;letter-spacing:.12em;color:{{t.mute2}}">OBRAS CONCLUÍDAS · 4</span>
    <h1 style="margin:0;font-size:28px;letter-spacing:-.01em">Prontas e no ar</h1>
   </div>
   <label style="margin-left:auto;display:flex;align-items:center;gap:8px;height:44px;width:280px;box-sizing:border-box;padding:0 14px;border-radius:12px;background:{{t.input}};border:1px solid {{t.cardB}};color:{{t.mute2}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <span style="position:absolute;left:-9999px">Buscar obra pelo nome</span>
    <input type="search" placeholder="Buscar obra pelo nome" style="flex:1;min-width:0;border:0;background:transparent;color:{{t.text}};font:15px 'Geist',sans-serif;outline:none">
   </label>
  </div>
  <p style="margin:0;font-size:15px;line-height:1.5;color:{{t.mute}};max-width:780px">Quer mudar alguma coisa numa obra pronta? Abra e converse com o Atlas. Enquanto ele constrói a mudança, a obra volta para o Canteiro; quando termina, volta para cá.</p>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px">
   <sc-for list="{{obras}}" as="o" hint-placeholder-count="4">
    <a href="K3Obra.dc.html" class="k-card" aria-label="{{o.aria}}" style="display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:{{t.card}};border:1px solid {{t.cardB}};color:{{t.text}}">
     <div style="position:relative;height:150px;background:{{t.cena}}">
      <img src="/_blob/43c73c51d3fb529d426014fb2be78397" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
      <span style="position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;background:{{t.lime}};color:{{t.onLime}};font:700 11px 'Geist Mono',monospace;letter-spacing:.08em"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>NO AR</span>
     </div>
     <div style="display:flex;flex-direction:column;gap:8px;padding:16px 18px 18px">
      <b style="font-size:18px">{{o.nome}}</b>
      <span style="display:flex;align-items:center;gap:6px;font:500 13px 'Geist Mono',monospace;color:{{t.limeTxt}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>{{o.end}}</span>
      <span style="font-size:14px;color:{{t.mute}}">{{o.quando}}</span>
      <span style="margin-top:6px;display:flex;align-items:center;gap:6px;font:600 14px 'Geist',sans-serif;color:{{t.limeTxt}}">Abrir a obra<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
     </div>
    </a>
   </sc-for>
  </div>
 </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["escuro","claro"],"default":"escuro"},"$preview":{"width":1440,"height":900}}'>
const T = {
  escuro: { bg: '#141619', card: '#1E2125', cardB: '#2C3036', text: '#EDEFEA', mute: '#B4BBB2', mute2: '#8E968C', lime: '#C6F135', limeTxt: '#C6F135', onLime: '#141619', input: '#16181B', cena: '#1A1D21' },
  claro: { bg: '#F2F3EE', card: '#FFFFFF', cardB: '#DADDD3', text: '#1B1E22', mute: '#5F665C', mute2: '#6B7268', lime: '#B6E22E', limeTxt: '#4E6B00', onLime: '#1B1E22', input: '#FFFFFF', cena: '#EEF0EA' }
};
class Component extends DCLogic {
  renderVals() {
    const tema = this.props.tema ?? 'escuro'; const t = T[tema] || T.escuro;
    const o = (nome, end, quando) => ({ nome, end, quando, aria: `${nome}, no ar em ${end}` });
    const obras = [
      o('Barbearia do Zé', 'barbeariadoze.com.br', 'Concluída em 12/11 · 3 mudanças depois'),
      o('Controle de Obras', 'obras.classica.eng.br', 'Concluída em 04/11'),
      o('Pedidos da Padaria', 'padariasol.app.br', 'Concluída em 28/10'),
      o('Check-in da Academia', 'academiafit.app.br', 'Concluída em 15/10')
    ];
    return { tema, t, obras };
  }
}
</script>
</body>
</html>
