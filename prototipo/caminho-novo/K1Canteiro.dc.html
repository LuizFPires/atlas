<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atlas · Canteiro de obras</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{text-decoration:none}
@keyframes kpisca{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes kvarre{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.k-card{transition:transform .2s ease, box-shadow .2s ease}
.k-card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.k-vivo{opacity:0;transition:opacity .25s ease}
.k-card:hover .k-vivo{opacity:1}
.k-card:hover .k-foto{filter:none}
.k-varre{animation:kvarre 2.4s linear infinite}
.k-pisca{animation:kpisca 1.2s infinite}
@media (prefers-reduced-motion: reduce){.k-varre,.k-pisca{animation:none}}</style>
</helmet>
<div style="width:1440px;height:900px;background:{{t.bg}};color:{{t.text}};font-family:'Geist',system-ui,sans-serif;display:flex;overflow:hidden">
 <dc-import name="Shell" ativo="canteiro" tema="{{tema}}" hint-size="248px,900px"></dc-import>
 <main style="flex:1;min-width:0;box-sizing:border-box;padding:28px 36px;display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;align-items:flex-end;gap:16px">
   <div style="display:flex;flex-direction:column;gap:6px">
    <span style="font:500 12px 'Geist Mono',monospace;letter-spacing:.12em;color:{{t.mute2}}">CANTEIRO DE OBRAS</span>
    <h1 style="margin:0;font-size:28px;letter-spacing:-.01em">Suas obras em andamento</h1>
   </div>
   <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
    <label style="display:flex;align-items:center;gap:8px;height:44px;width:280px;box-sizing:border-box;padding:0 14px;border-radius:12px;background:{{t.input}};border:1px solid {{t.cardB}};color:{{t.mute2}}">
     <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
     <span style="position:absolute;left:-9999px">Buscar obra pelo nome</span>
     <input type="search" placeholder="Buscar obra pelo nome" style="flex:1;min-width:0;border:0;background:transparent;color:{{t.text}};font:15px 'Geist',sans-serif;outline:none">
    </label>
    <a href="CN1Ideia.dc.html" style="display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;background:{{t.lime}};color:{{t.onLime}};font:700 15px 'Geist',sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nova obra</a>
   </div>
  </div>

  <div role="group" aria-label="Filtrar obras" style="display:flex;gap:8px">
   <sc-for list="{{filtros}}" as="f" hint-placeholder-count="5">
    <button type="button" aria-pressed="{{f.on}}" style="display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:1px solid {{f.borda}};background:{{f.bg}};color:{{t.text}};font:600 14px 'Geist',sans-serif;cursor:pointer"><span style="width:8px;height:8px;border-radius:4px;background:{{f.ponto}}"></span>{{f.nome}}<span style="font:500 13px 'Geist Mono',monospace;color:{{t.mute}}">{{f.n}}</span></button>
   </sc-for>
   <span style="margin-left:auto;align-self:center;font-size:13px;color:{{t.mute2}}">Passe o mouse num cartão para ver a obra ao vivo</span>
  </div>

  <div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:18px">
   <sc-for list="{{obras}}" as="o" hint-placeholder-count="6">
    <a href="K3Obra.dc.html" class="k-card" aria-label="{{o.aria}}" style="display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:{{t.card}};border:1px solid {{o.borda}};color:{{t.text}}">
     <div style="position:relative;height:150px;flex:none;background:{{o.fundoCena}};overflow:hidden">
      <sc-if value="{{o.temFoto}}">
       <img class="k-foto" src="/_blob/43c73c51d3fb529d426014fb2be78397" alt="" style="width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) brightness(.92)">
      </sc-if>
      <sc-if value="{{o.terreno}}">
       <svg viewBox="0 0 400 150" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="M0 112 L120 82 L400 104 L400 150 L0 150 Z" fill="{{t.terra}}"/><path d="M120 82 L400 104" stroke="{{t.terraLinha}}" stroke-width="1.5" fill="none"/><g stroke="{{t.ambar}}" stroke-width="2" stroke-linecap="round"><path d="M160 96v-22M250 102v-24M205 80v-20M300 106v-22"/></g><path d="M160 74 L205 60 L250 78 L300 84" stroke="{{t.ambar}}" stroke-width="1.4" stroke-dasharray="5 5" fill="none"/></svg>
      </sc-if>
      <span class="k-vivo" style="position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(198,241,53,.16),transparent)"><span class="k-varre" style="display:block;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent)"></span></span>
      <span class="k-vivo" style="position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:rgba(16,18,20,.82);color:#EDEFEA;font:600 11px 'Geist Mono',monospace;letter-spacing:.1em"><span class="k-pisca" style="width:7px;height:7px;border-radius:4px;background:#C6F135"></span>AO VIVO</span>
      <span style="position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;background:{{o.seloBg}};color:{{o.seloCor}};font:600 11px 'Geist Mono',monospace;letter-spacing:.08em"><span style="width:7px;height:7px;border-radius:4px;background:{{o.seloPonto}}"></span>{{o.selo}}</span>
     </div>
     <div style="flex:1;display:flex;flex-direction:column;gap:10px;padding:16px 18px 18px">
      <div style="display:flex;align-items:baseline;gap:10px"><b style="font-size:18px">{{o.nome}}</b><span style="margin-left:auto;font:600 14px 'Geist Mono',monospace;color:{{o.pctCor}}">{{o.pct}}</span></div>
      <span style="height:6px;border-radius:3px;background:{{t.line}};overflow:hidden"><span style="display:block;height:100%;width:{{o.largura}};border-radius:3px;background:{{o.barra}}"></span></span>
      <span style="font-size:14px;line-height:1.45;color:{{t.mute}}">{{o.linha}}</span>
      <span style="margin-top:auto;display:flex;align-items:center;gap:6px;font:600 14px 'Geist',sans-serif;color:{{o.acaoCor}}">{{o.acao}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
     </div>
    </a>
   </sc-for>
  </div>
 </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["escuro","claro"],"default":"escuro"},"$preview":{"width":1440,"height":900}}'>
const T = {
  escuro: { bg: '#141619', card: '#1E2125', card2: '#191B1E', cardB: '#2C3036', text: '#EDEFEA', mute: '#B4BBB2', mute2: '#8E968C', lime: '#C6F135', limeTxt: '#C6F135', onLime: '#141619', soft: 'rgba(198,241,53,.10)', input: '#16181B', line: '#2A2E33', ambar: '#F2B84B', ambarSoft: 'rgba(242,184,75,.14)', terra: '#2A2620', terraLinha: '#4A4134', cena: '#1A1D21', selo: 'rgba(16,18,20,.82)', seloTxt: '#EDEFEA' },
  claro: { bg: '#F2F3EE', card: '#FFFFFF', card2: '#F7F8F4', cardB: '#DADDD3', text: '#1B1E22', mute: '#5F665C', mute2: '#6B7268', lime: '#B6E22E', limeTxt: '#4E6B00', onLime: '#1B1E22', soft: 'rgba(182,226,46,.18)', input: '#FFFFFF', line: '#E6E8E1', ambar: '#A86A00', ambarSoft: 'rgba(214,150,30,.14)', terra: '#E9E2D4', terraLinha: '#CDBFA5', cena: '#EEF0EA', selo: 'rgba(255,255,255,.92)', seloTxt: '#1B1E22' }
};
class Component extends DCLogic {
  renderVals() {
    const tema = this.props.tema ?? 'escuro'; const t = T[tema] || T.escuro;
    const falta = (nome, etapa, proximo) => ({ nome, aria: `${nome}: falta terminar, ${etapa}. ${proximo}`, selo: `FALTA TERMINAR · ${etapa}`, seloBg: t.selo, seloCor: t.ambar, seloPonto: t.ambar, borda: t.ambar, temFoto: false, terreno: true, fundoCena: t.cena, pct: '', pctCor: t.mute, largura: '0%', barra: t.ambar, linha: 'O canteiro ainda não começou. Termine as etapas e o Atlas constrói sozinho.', acao: proximo, acaoCor: t.ambar });
    const obra = (nome, pct, linha, extra) => Object.assign({ nome, aria: `${nome}: em construção, ${pct}`, selo: 'EM CONSTRUÇÃO', seloBg: t.selo, seloCor: t.seloTxt, seloPonto: t.lime, borda: t.cardB, temFoto: true, terreno: false, fundoCena: t.cena, pct, pctCor: t.limeTxt, largura: pct, barra: t.lime, linha, acao: 'Abrir a obra', acaoCor: t.limeTxt }, extra || {});
    const obras = [
      falta('Academia do Zé', '3 DE 6', 'Próximo: escolher o nome'),
      obra('Meu Ponto', '64%', 'Trabalhando agora: a tela de relatórios do mês.', { selo: 'TRABALHANDO AGORA' }),
      obra('Estoque da Loja', '41%', 'Parou ontem às 18h, quando o computador desligou.', { selo: 'PARADA', seloPonto: t.mute2, acao: 'Continuar obra', aria: 'Estoque da Loja: parada. Continuar obra' }),
      obra('Agenda da Clínica', '78%', 'O limite do Claude acabou. Volta sozinha às 15h.', { selo: 'ESPERANDO O CLAUDE', seloPonto: t.mute2, acao: 'Abrir a obra' }),
      falta('Orçamentos Rápidos', '1 DE 6', 'Próximo: contar a ideia'),
      obra('Cardápio do Bar', '22%', 'Construindo: a tela do carrinho de pedidos.')
    ];
    const filtros = [
      { nome: 'Todas', n: '6', on: 'true', bg: t.soft, borda: t.lime, ponto: t.lime },
      { nome: 'Falta terminar', n: '2', on: 'false', bg: 'transparent', borda: t.cardB, ponto: t.ambar },
      { nome: 'Em construção', n: '4', on: 'false', bg: 'transparent', borda: t.cardB, ponto: t.mute2 }
    ];
    return { tema, t, obras, filtros };
  }
}
</script>
</body>
</html>
