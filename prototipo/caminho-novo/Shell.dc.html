<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atlas · menu lateral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<aside style="width:248px;height:900px;box-sizing:border-box;padding:24px 16px;background:{{t.side}};border-right:1px solid {{t.sideBorder}};display:flex;flex-direction:column;gap:6px;font-family:'Geist',system-ui,sans-serif">
 <div style="display:flex;align-items:center;gap:10px;padding:4px 10px 22px">
  <img src="{{t.mono}}" alt="" style="width:44px;height:24px;object-fit:contain">
  <img src="/_blob/c6750a5c1d7f64643b22288c9d2a18d2" alt="Atlas" style="width:114px;height:17px;object-fit:contain">
 </div>
 <sc-for list="{{itens}}" as="it" hint-placeholder-count="5">
  <a href="{{it.href}}" style="display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;text-decoration:none;background:{{it.bg}};color:{{it.cor}};font-weight:{{it.peso}}">
   <span style="width:8px;height:8px;border-radius:4px;background:{{it.marca}}"></span>{{it.nome}}
  </a>
 </sc-for>
 <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
  <button aria-label="Falar com o Atlas" style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:12px;border:none;background:{{t.lime}};color:#141619;font:700 15px 'Geist',sans-serif;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Falar com o Atlas</button>
  <a href="CN1Ideia.dc.html" style="display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;border:1px solid {{t.sideBorder2}};color:#EDEFEA;font:600 14px 'Geist',sans-serif;text-decoration:none">Ajuda do Atlas</a>
  <div style="background:{{t.sideCard}};border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px">
   <span style="font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;color:{{t.sideMute}}">PLANO CLAUDE</span>
   <span style="font-size:15px;font-weight:600;color:#EDEFEA">Pro</span>
   <span style="font-size:13px;color:{{t.sideMute}}">Conectado neste computador</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:{{t.sideMute}};padding:0 6px"><span style="width:8px;height:8px;border-radius:4px;background:{{t.lime}}"></span>Licença ativa · este computador</div>
 </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ativo":{"editor":"enum","options":["obras","canteiro","concluidas","lancamentos"],"default":"obras"},"tema":{"editor":"enum","options":["escuro","claro"],"default":"escuro"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const claro = (this.props.tema ?? 'escuro') === 'claro';
    const t = claro
      ? { side: '#1F2226', sideBorder: '#1F2226', sideCard: '#2A2E33', sideMute: '#B9BEB5', sideBorder2: '#3A3F46', lime: '#B6E22E', mono: '/_blob/cf1beaa186df4dada45f5f7027b51b02', actBg: '#B6E22E', actCor: '#1B1E22', actMarca: '#1B1E22' }
      : { side: '#101214', sideBorder: '#24282D', sideCard: '#1A1D21', sideMute: '#9BA39A', sideBorder2: '#2C3036', lime: '#C6F135', mono: '/_blob/12f422513e54daca2767634612b51c95', actBg: '#22262B', actCor: '#EDEFEA', actMarca: '#C6F135' };
    const ativo = this.props.ativo ?? 'obras';
    // Lançamentos (Luiz, 25/11/2026): só as obras que o cliente decidiu vender.
    // Menu novo (Luiz, 23/11/2026): tudo de uma obra mora dentro dela. Protótipo, Obra, Pós-obra e Como retomar saíram do menu.
    const base = [
      { id: 'obras', nome: 'Nova obra', href: 'CN1Ideia.dc.html' },
      { id: 'canteiro', nome: 'Canteiro de obras', href: 'K1Canteiro.dc.html' },
      { id: 'concluidas', nome: 'Obras concluídas', href: 'K2Concluidas.dc.html' },
      { id: 'lancamentos', nome: 'Lançamentos', href: 'LC6Lancamentos.dc.html' }
    ];
    const itens = base.map(i => i.id === ativo
      ? { ...i, bg: t.actBg, cor: t.actCor, marca: t.actMarca, peso: 600 }
      : { ...i, bg: 'transparent', cor: t.sideMute, marca: 'transparent', peso: 400 });
    return { t, itens };
  }
}
</script>
</body>
</html>
