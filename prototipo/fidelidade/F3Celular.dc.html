<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atlas · Fidelidade · No celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Fraunces:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{text-decoration:none}</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#FBF7F2;color:#2F3A31;font-family:'Geist',sans-serif;display:flex;flex-direction:column;overflow:hidden">
 <div style="flex:none;background:#141619;color:#EDEFEA;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px"><span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.1em;color:#C6F135">PROTÓTIPO</span><span style="flex:1;color:#B4BBB2">Meu Ponto · versão 2</span><button onClick="{{alternar}}" style="height:30px;padding:0 10px;border-radius:8px;border:1px solid #2C3036;background:transparent;color:#EDEFEA;font:600 12px 'Geist',sans-serif">{{rotTelas}}</button></div>
 <div style="background:#2F3A31;color:#FBF7F2;padding:20px 18px 18px"><span style="font-size:12px;opacity:.75">Residencial Vila Serena</span><b style="display:block;font:600 24px 'Fraunces',serif">Bom dia, José</b></div>
 <div style="flex:1;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:14px">
  <span style="font-size:48px;font-weight:700;letter-spacing:-.02em">06h56</span>
  <span style="font-size:14px;color:#6E7A6F;text-align:center">Você está a 86 m da obra · dentro do raio</span>
  <a href="F3Celular.dc.html" style="width:190px;height:190px;border-radius:50%;background:#B5651D;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin-top:8px">Bater o ponto</a>
 </div>
 <sc-if value="{{lista}}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;top:50px;left:0;width:390px;height:794px;background:rgba(20,22,25,.96);color:#EDEFEA;padding:18px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px"><b style="font-size:16px;margin-bottom:8px">Ir para a tela</b><sc-for list="{{telas}}" as="x" hint-placeholder-count="6"><span style="min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:#1E2125">{{x}}</span></sc-for></div>
 </sc-if>
 <div style="flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #E2D8CC;background:#fff;font-size:12px;text-align:center"><span style="padding:12px 0;font-weight:700">Ponto</span><span style="padding:12px 0;color:#6E7A6F">Minhas horas</span><span style="padding:12px 0;color:#6E7A6F">Avisos</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lista: false }; }
  renderVals() {
    return { lista: this.state.lista, rotTelas: this.state.lista ? 'Fechar' : 'Telas', alternar: () => this.setState({ lista: !this.state.lista }), telas: ['Entrar', 'Bater o ponto', 'Minhas horas', 'Avisos', 'Atrasos de hoje', 'Ajustar um ponto'] };
  }
}
</script>
</body>
</html>
