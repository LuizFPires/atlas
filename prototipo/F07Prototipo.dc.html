<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atlas · 07 Protótipo com o Claude</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:1440px;height:900px;background:{{t.bg}};color:{{t.text}};font-family:'Geist',system-ui,sans-serif;display:flex">
 <dc-import name="Shell" ativo="prototipo" tema="{{tema}}" hint-size="248px,900px"></dc-import>
 <main style="flex:1;box-sizing:border-box;padding:28px 36px;display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;align-items:center;gap:14px">
   <div style="display:flex;flex-direction:column;gap:4px"><span style="font:500 12px 'Geist Mono',monospace;letter-spacing:.12em;color:{{t.mute2}}">PROJETO 2 DE 3 · TELAS · ESTILO "COURO E MADEIRA" · VERSÃO 3</span><h1 style="margin:0;font-size:26px">Agenda da Barbearia do Zé</h1></div>
   <div style="margin-left:auto;display:flex;gap:10px">
    <button style="height:44px;padding:0 16px;border-radius:12px;border:1px solid {{t.cardB}};background:transparent;color:{{t.text}};font:600 15px 'Geist',sans-serif">↶ Voltar à versão 2</button>
    <a href="F07bBatismo.dc.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:12px;background:{{t.lime}};color:{{t.onLime}};font-weight:700;font-size:15px;text-decoration:none">Telas do meu jeito: dar o nome →</a>
   </div>
  </div>
  <div style="flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;min-height:0">
   <section style="background:{{t.card}};border:1px solid {{t.cardB}};border-radius:20px;display:flex;flex-direction:column;overflow:hidden">
    <div style="flex:1;padding:22px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
     <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <div style="align-self:{{m.lado}};max-width:78%;background:{{m.bg}};color:{{m.cor}};border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.5"><b style="display:block;font-size:12px;letter-spacing:.06em;margin-bottom:4px;opacity:.75">{{m.quem}}</b>{{m.txt}}</div>
     </sc-for>
    </div>
    <div style="border-top:1px solid {{t.line}};padding:14px;display:flex;gap:10px;align-items:center">
     <label for="pedido" style="position:absolute;left:-9999px">Pedir ajuste</label>
     <button aria-label="Falar o pedido" style="width:48px;height:48px;flex:none;border-radius:24px;border:none;background:{{t.lime}};color:{{t.onLime}};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
     <input id="pedido" placeholder="Fale ou escreva: &quot;troque a cor&quot;, &quot;tire o campo de e-mail&quot;…" style="flex:1;height:48px;border-radius:12px;border:1px solid {{t.cardB}};background:{{t.input}};color:{{t.text}};padding:0 14px;font:15px 'Geist',sans-serif">
     <button aria-label="Mandar foto ou print" style="width:48px;height:48px;border-radius:12px;border:1px solid {{t.cardB}};background:transparent;color:{{t.text}};font-size:18px">📎</button>
     <button style="height:48px;padding:0 18px;border-radius:12px;border:none;background:{{t.lime}};color:{{t.onLime}};font:700 15px 'Geist',sans-serif">Enviar</button>
    </div>
   </section>
   <section style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
     <sc-for list="{{abas}}" as="a" hint-placeholder-count="4"><button onClick="{{a.ir}}" style="height:36px;padding:0 12px;border-radius:999px;border:1px solid {{a.borda}};background:{{a.bg}};color:{{a.cor}};font:600 13px 'Geist',sans-serif">{{a.nome}}</button></sc-for>
    </div>
    <div style="width:320px;height:640px;border-radius:40px;background:#0B0C0D;padding:12px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.35)">
     <div style="width:100%;height:100%;border-radius:30px;background:#FBF7F2;color:#2B211B;overflow:hidden;display:flex;flex-direction:column">
      <div style="background:#2B211B;color:#FBF7F2;padding:26px 18px 16px;display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;opacity:.7">Barbearia do Zé</span><b style="font-size:20px">{{tela.titulo}}</b></div>
      <sc-if value="{{tela.agendar}}" hint-placeholder-val="{{ true }}">
       <div style="padding:16px;display:flex;flex-direction:column;gap:10px">
        <span style="font-size:13px;font-weight:600">Escolha o barbeiro</span>
        <div style="display:flex;gap:8px"><span style="flex:1;padding:10px;border-radius:12px;background:#2B211B;color:#FBF7F2;font-size:13px;text-align:center">Zé</span><span style="flex:1;padding:10px;border-radius:12px;border:1px solid #D9CFC4;font-size:13px;text-align:center">Rafa</span><span style="flex:1;padding:10px;border-radius:12px;border:1px solid #D9CFC4;font-size:13px;text-align:center">Léo</span></div>
        <span style="font-size:13px;font-weight:600;margin-top:6px">Quinta, 20/11</span>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
         <sc-for list="{{horas}}" as="h" hint-placeholder-count="9"><span style="padding:10px 0;border-radius:10px;text-align:center;font-size:13px;background:{{h.bg}};color:{{h.cor}};border:1px solid #D9CFC4;text-decoration:{{h.risco}}">{{h.h}}</span></sc-for>
        </div>
        <span style="margin-top:8px;padding:14px;border-radius:14px;background:#B5651D;color:#FFFFFF;text-align:center;font-weight:700;font-size:15px">Marcar às 15:30</span>
       </div>
      </sc-if>
      <sc-if value="{{tela.agenda}}" hint-placeholder-val="{{ false }}">
       <div style="padding:16px;display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{agenda}}" as="g" hint-placeholder-count="4"><div style="display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:#FFFFFF;border:1px solid #EAE2D8"><b style="font-size:14px;width:46px">{{g.h}}</b><div style="display:flex;flex-direction:column"><span style="font-size:14px;font-weight:600">{{g.nome}}</span><span style="font-size:12px;color:#7A6A5E">{{g.serv}}</span></div><span style="margin-left:auto;font-size:11px;padding:4px 8px;border-radius:999px;background:{{g.stBg}}">{{g.st}}</span></div></sc-for>
       </div>
      </sc-if>
     </div>
    </div>
   </section>
  </div>
 </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["escuro","claro"],"default":"escuro"},"$preview":{"width":1440,"height":900}}'>
const T = {
  escuro: { bg: '#141619', card: '#1E2125', cardB: '#2C3036', text: '#EDEFEA', mute: '#B4BBB2', mute2: '#8E968C', lime: '#C6F135', onLime: '#141619', input: '#16181B', line: '#2A2E33', me: '#2A3A12', claude: '#22262B' },
  claro: { bg: '#F2F3EE', card: '#FFFFFF', cardB: '#DADDD3', text: '#1B1E22', mute: '#5F665C', mute2: '#6B7268', lime: '#B6E22E', onLime: '#1B1E22', input: '#FFFFFF', line: '#E6E8E1', me: '#DDF59A', claude: '#F2F3EE' }
};
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { aba: 'agendar' }; }
  renderVals() {
    const tema = this.props.tema ?? 'escuro';
    const t = T[tema] || T.escuro;
    const c = (quem, txt) => ({ quem, txt, lado: quem === 'VOCÊ' ? 'flex-end' : 'flex-start', bg: quem === 'VOCÊ' ? t.me : t.claude, cor: t.text });
    const msgs = [
      c('CLAUDE', 'Fiz a tela de marcar horário: o cliente escolhe o barbeiro, o dia e a hora. Dá uma olhada no celular ao lado.'),
      c('VOCÊ', 'Ficou bom! Mas os horários ocupados têm que aparecer riscados, senão o cliente fica clicando.'),
      c('CLAUDE', 'Feito na versão 3: horário ocupado aparece riscado e não dá para clicar. Quer que o cliente receba a confirmação pelo WhatsApp?'),
      c('VOCÊ', 'Quero. E eu preciso ver a agenda de todos os barbeiros no meu celular.')
    ];
    const aba = this.state.aba;
    const nomes = [['agendar', 'Marcar horário'], ['agenda', 'Agenda do dia'], ['conf', 'Confirmação'], ['inicio', 'Início']];
    const abas = nomes.map(([id, nome]) => ({ nome, bg: id === aba ? t.lime : 'transparent', cor: id === aba ? t.onLime : t.text, borda: id === aba ? t.lime : t.cardB, ir: () => this.setState({ aba: id === 'agenda' ? 'agenda' : 'agendar' }) }));
    const ocup = ['09:00', '10:30', '14:00'];
    const horas = ['09:00', '09:30', '10:00', '10:30', '11:00', '14:00', '15:00', '15:30', '16:00'].map(h => ({ h, bg: h === '15:30' ? '#2B211B' : (ocup.includes(h) ? '#EFE9E2' : '#FFFFFF'), cor: h === '15:30' ? '#FBF7F2' : (ocup.includes(h) ? '#A89A8E' : '#2B211B'), risco: ocup.includes(h) ? 'line-through' : 'none' }));
    const agenda = [
      { h: '09:00', nome: 'Carlos M.', serv: 'Corte + barba · Zé', st: 'Confirmado', stBg: '#DCEFC9' },
      { h: '10:30', nome: 'Pedro A.', serv: 'Corte · Rafa', st: 'Confirmado', stBg: '#DCEFC9' },
      { h: '14:00', nome: 'Lucas F.', serv: 'Barba · Léo', st: 'Aguardando', stBg: '#F6E3C2' },
      { h: '15:30', nome: 'Você marcou', serv: 'Corte · Zé', st: 'Novo', stBg: '#E3E7F6' }
    ];
    const tela = aba === 'agenda' ? { titulo: 'Agenda de hoje', agendar: false, agenda: true } : { titulo: 'Marcar horário', agendar: true, agenda: false };
    return { tema, t, msgs, abas, horas, agenda, tela };
  }
}
</script>
</body>
</html>
