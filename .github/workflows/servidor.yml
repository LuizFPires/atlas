# Servidor do Atlas no ar sozinho (pedido do Luiz, 23/11/2026: "atualizou o Atlas, atualiza em tudo").
# Antes, a função "api" do Supabase só mudava quando o Luiz publicava à mão; o app novo chegava, mas o servidor ficava velho
# (ex.: a rota /atualizacao). Agora, todo merge na main que mexe em supabase/functions publica a função na hora.
#
# Precisa de UM segredo no GitHub (Settings → Secrets and variables → Actions): SUPABASE_ACCESS_TOKEN, criado pelo Luiz em
# supabase.com/dashboard/account/tokens. Nunca em arquivo. Sem ele, este passo só avisa e não falha.
name: Servidor (Supabase) no ar

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/servidor.yml']
  workflow_dispatch:

concurrency: { group: servidor-supabase, cancel-in-progress: false }

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar a função api (Verify JWT desligado, como sempre)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta o segredo SUPABASE_ACCESS_TOKEN: o servidor NÃO foi atualizado. Publique à mão ou crie o segredo."
            exit 0
          fi
          npx --yes supabase@latest functions deploy api --no-verify-jwt --project-ref jwnrzcyudurdrxhjfdua
      - name: Conferir que a rota da atualização existe (404 = servidor velho)
        if: env.TEM == 'sim'
        env:
          TEM: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && 'sim' || 'nao' }}
        run: |
          codigo=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' \
            https://jwnrzcyudurdrxhjfdua.supabase.co/functions/v1/api/atualizacao)
          echo "POST /atualizacao sem credencial: HTTP $codigo (esperado 401/403/400)"
          [ "$codigo" != "404" ] || { echo "::error::A rota /atualizacao não existe no servidor publicado."; exit 1; }
