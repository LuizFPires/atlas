# Gera o instalador de TESTE do Atlas para Windows (SEM assinatura) e confere, na própria máquina do GitHub,
# que ele instala. Serve para o Luiz e convidados de confiança: o Windows vai avisar "editor desconhecido".
# O instalador assinado (Azure Trusted Signing) continua sendo o `npm run instalador`, com as credenciais.
name: Instalador de teste (Windows)
# Em PR que mexe no app ou no instalador: só gera e confere que instala. O arquivo que a página entrega (no Supabase) só é
# trocado pela main ou por disparo manual, para nunca servir código que ainda não foi aprovado.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'instalador/**', 'src/app/**', '.github/workflows/instalador-teste.yml']
  pull_request:
    paths: ['app/**', 'instalador/**', 'src/app/**', '.github/workflows/instalador-teste.yml']

# contents: write é só para apagar a release antiga do GitHub (passo temporário, ver abaixo).
permissions:
  contents: write

env:
  # O pacote da voz traz um motor de servidor com placa de vídeo que o Atlas não usa: não baixar.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  # Endereços públicos do projeto no Supabase (os mesmos que o site usa; não são segredo).
  SUPABASE_URL: https://jwnrzcyudurdrxhjfdua.supabase.co
  ATLAS_API: https://jwnrzcyudurdrxhjfdua.supabase.co/functions/v1/api

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Cada instalador tem um número próprio (0.1.<rodada>): é assim que o Atlas instalado percebe que há versão nova.
      - name: Versão deste instalador
        shell: bash
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Tela do app (dist-app) com o endereço do servidor
        run: npm run build:app
        env:
          VITE_API_URL: ${{ env.ATLAS_API }}
          # Conta de pagamento que o site usa (pública, vem no próprio site): a compra de dentro do app abre o mesmo checkout.
          VITE_CONTA_ID: 71bb1474-0ddd-44c1-a17b-40050f94ae7d

      - name: Endereço do servidor para o processo principal (app/config.json)
        shell: bash
        run: |
          printf '{ "api": "%s" }\n' "$ATLAS_API" > app/config.json

      - name: Config de teste (sem assinatura)
        shell: bash
        run: |
          node -e "
            const fs = require('fs')
            const c = JSON.parse(fs.readFileSync('instalador/electron-builder.json', 'utf8'))
            delete c.win.azureSignOptions
            c.win.artifactName = 'Atlas-Instalador-TESTE-\${version}.\${ext}'
            fs.writeFileSync('instalador/electron-builder.teste.json', JSON.stringify(c, null, 2))
          "

      - name: Gerar o instalador
        run: npm exec --package=electron-builder@26.18.0 -- electron-builder --config instalador/electron-builder.teste.json --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Conferir que instala (instalação silenciosa nesta máquina)
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter 'Atlas-Instalador-TESTE-*.exe' | Select-Object -First 1
          if (-not $exe) { Write-Error 'instalador não foi gerado'; exit 1 }
          "Instalador: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB)"
          # Como o cliente recebe: o arquivo baixado pela página chama Atlas-Instalador-<código do link>.exe.
          $codigo = 'c' * 30
          $baixado = Join-Path $env:TEMP "Atlas-Instalador-$codigo.exe"
          Copy-Item $exe.FullName $baixado
          $p = Start-Process -FilePath $baixado -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(900000)) { $p.Kill(); Write-Error 'a instalação não terminou em 15 minutos'; exit 1 }
          "Código de saída do instalador: $($p.ExitCode)"
          Start-Sleep -Seconds 8
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Atlas\Atlas.exe'
          $obras = Join-Path $env:USERPROFILE 'Atlas\Obras'
          $atalho = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Atlas · minhas obras.lnk'
          $aberto = [bool](Get-Process -Name Atlas -ErrorAction SilentlyContinue)
          # O instalador tem de abrir o app dizendo o nome do arquivo baixado: é dali que o app tira o código do link.
          $linhas = @(Get-CimInstance Win32_Process -Filter "Name='Atlas.exe'" | ForEach-Object { $_.CommandLine })
          $recebeuNome = [bool]($linhas | Where-Object { $_ -like "*--instalador=Atlas-Instalador-$codigo.exe*" })
          $claude = [bool](Get-Command claude -ErrorAction SilentlyContinue)
          $r = [ordered]@{
            'Atlas.exe instalado' = (Test-Path $app)
            'Pasta das obras criada' = (Test-Path $obras)
            'Atalho na área de trabalho' = (Test-Path $atalho)
            'config.json dentro do pacote' = [bool](Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs\Atlas\resources') -Recurse -Filter 'app.asar' -ErrorAction SilentlyContinue)
            'Claude Code instalado' = $claude
            'App abriu sozinho na ativação' = $aberto
            'App recebeu o nome do instalador (código do link)' = $recebeuNome
            'Endereço atlas:// registrado no Windows' = (Test-Path 'HKCU:\Software\Classes\atlas')
          }
          $r.GetEnumerator() | ForEach-Object { "{0}: {1}" -f $_.Key, $(if ($_.Value) { 'sim' } else { 'NÃO' }) }
          "## Instalador de teste`n" + (($r.GetEnumerator() | ForEach-Object { "- {0}: **{1}**" -f $_.Key, $(if ($_.Value) { 'sim' } else { 'NÃO' }) }) -join "`n") >> $env:GITHUB_STEP_SUMMARY
          Get-Process -Name Atlas -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path $app) -or -not (Test-Path $obras) -or -not $recebeuNome) { exit 1 }

      # A hospedagem saiu do GitHub (a release era pública enquanto o repositório for público). Este passo apaga a release
      # antiga, se ainda existir; depois da primeira rodada pode ser removido junto com o "contents: write" acima.
      - name: Apagar a release antiga do GitHub (se existir)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view instalador-teste >/dev/null 2>&1; then
            gh release delete instalador-teste --cleanup-tag --yes && echo "release instalador-teste apagada"
          else
            echo "não há release instalador-teste"
          fi

      # A página /instalar entrega este arquivo: o servidor pede ao Storage um endereço temporário para quem tem link válido.
      # Só a main ou o disparo manual trocam o arquivo; PR nunca sobe nada. Precisa do segredo SUPABASE_SERVICE_ROLE_KEY.
      - name: Enviar para a pasta privada do Supabase (bucket "instalador")
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::Segredo SUPABASE_SERVICE_ROLE_KEY nao cadastrado: o instalador foi gerado, mas NAO foi enviado ao Supabase."
            exit 0
          fi
          base="$SUPABASE_URL/storage/v1"
          auth=(-H "Authorization: Bearer $SUPABASE_KEY" -H "apikey: $SUPABASE_KEY")
          # Cria o bucket privado na primeira vez (se já existe, o Supabase responde que é duplicado e seguimos).
          curl -sS -o bucket.json -w 'Criar bucket: HTTP %{http_code}\n' "${auth[@]}" -H 'Content-Type: application/json' -d '{"id":"instalador","name":"instalador","public":false}' "$base/bucket"
          arquivo=$(ls release/Atlas-Instalador-TESTE-*.exe | head -1)
          codigo=$(curl -sS -o envio.json -w '%{http_code}' -X POST "${auth[@]}" -H 'Content-Type: application/octet-stream' -H 'x-upsert: true' --data-binary "@$arquivo" "$base/object/instalador/Atlas-Instalador.exe")
          echo "Enviar arquivo: HTTP $codigo"
          if [ "$codigo" != "200" ]; then
            cat envio.json; echo
            [ "$codigo" = "413" ] && echo "::error::O Supabase recusou pelo tamanho. Aumente o limite de tamanho de arquivo nas configuracoes do Storage (o instalador tem mais de 100 MB)."
            exit 1
          fi

          # Atualização automática: o manifesto (versão + impressão digital sha512 + tamanho) vai DEPOIS do .exe, para nunca
          # apontar para um arquivo que ainda não subiu. O app confere a impressão digital antes de instalar.
          node -e "
            const fs = require('fs'), crypto = require('crypto')
            const b = fs.readFileSync(process.argv[1])
            fs.writeFileSync('atualizacao.json', JSON.stringify({ versao: require('./package.json').version, sha512: crypto.createHash('sha512').update(b).digest('base64'), tamanho: b.length }))
          " "$arquivo"
          cat atualizacao.json; echo
          codigo=$(curl -sS -o envio-manifesto.json -w '%{http_code}' -X POST "${auth[@]}" -H 'Content-Type: application/json' -H 'x-upsert: true' --data-binary @atualizacao.json "$base/object/instalador/atualizacao.json")
          echo "Enviar manifesto da atualizacao: HTTP $codigo"
          if [ "$codigo" != "200" ]; then cat envio-manifesto.json; echo; exit 1; fi

          # Confere como a página vai receber: endereço temporário baixa o arquivo inteiro, sem nenhuma credencial...
          assinado=$(curl -sS "${auth[@]}" -H 'Content-Type: application/json' -d '{"expiresIn":600}' "$base/object/sign/instalador/Atlas-Instalador.exe" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{process.stdout.write(JSON.parse(d).signedURL||'')}catch{}})")
          [ -n "$assinado" ] || { echo "::error::O Supabase nao devolveu o endereco temporario."; exit 1; }
          curl -sS -o baixado.exe -w 'Endereco temporario, sem credencial: HTTP %{http_code}, %{size_download} bytes\n' "$base$assinado"
          cmp baixado.exe "$arquivo" && echo "Arquivo baixado e identico ao gerado"
          # ...e o endereço direto, sem credencial, tem de ser negado (a pasta é privada).
          direto=$(curl -sS -o /dev/null -w '%{http_code}' "$base/object/public/instalador/Atlas-Instalador.exe")
          echo "Endereco direto, sem credencial: HTTP $direto"
          if [ "$direto" = "200" ]; then echo "::error::A pasta do instalador esta PUBLICA no Supabase."; exit 1; fi

      - name: Guardar o instalador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-instalador-teste
          path: release/Atlas-Instalador-TESTE-*.exe
          if-no-files-found: error
          retention-days: 7
