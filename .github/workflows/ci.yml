name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # A voz do Atlas instalado é o Whisper rodando no computador (o reconhecimento do navegador não funciona em app Electron).
  # Aqui o teste é de verdade: baixa o modelo, gera uma fala em português e confere a transcrição.
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q edge-tts
      # Voz neural natural em português (parecida com uma pessoa falando); a voz robótica do espeak engana até modelos grandes.
      - name: Fala de teste em português
        run: |
          edge-tts --voice pt-BR-AntonioNeural --text "Quero uma agenda para a minha barbearia, com os horários dos barbeiros." --write-media fala.mp3
          ffmpeg -loglevel error -i fala.mp3 -ar 16000 -ac 1 -f f32le fala.f32
      - run: node scripts/teste-voz.mjs fala.f32
      - name: Tamanho que o cliente baixa na primeira vez
        run: du -sh node_modules/@huggingface/transformers/.cache/onnx-community/* 2>/dev/null || find / -path '*onnx-community/whisper-small*' -name '*.onnx' -exec du -ch {} + 2>/dev/null | tail -1
