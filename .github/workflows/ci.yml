name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # A voz do Atlas instalado é o Whisper rodando no computador (o reconhecimento do navegador não funciona em app Electron).
  # Aqui o teste é de verdade: baixa o modelo, gera uma fala em português e confere a transcrição.
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Fala de teste em português
        run: |
          espeak-ng -v pt-br -s 140 -w fala.wav "Quero uma agenda para a minha barbearia"
          ffmpeg -loglevel error -i fala.wav -ar 16000 -ac 1 -f f32le fala.f32
      - name: Fala humana (gravação real em português, para comparar)
        run: |
          curl -sSL -o humana.mp3 "https://upload.wikimedia.org/wikipedia/commons/transcoded/0/0e/Pt-br-Ol%C3%A1.ogg/Pt-br-Ol%C3%A1.ogg.mp3" || true
      - name: Comparar modelos (temporário)
        run: |
          node scripts/comparar-voz.mjs fala.f32 2>&1 | grep RESULTADO || true
          du -sh ~/.cache/huggingface 2>/dev/null || true; du -sh node_modules/@huggingface/transformers/.cache 2>/dev/null || true
      - run: node scripts/teste-voz.mjs fala.f32
