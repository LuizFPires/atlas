<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face { font-family: Geist; src: url(/home/claude/atlas/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: GeistMono; src: url(/home/claude/atlas/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
body { width: 1280px; height: 720px; overflow: hidden; background: #0f1113; font-family: Geist, sans-serif; color: #EDEFEA; position: relative; }
.cena { position: absolute; inset: 0; opacity: 0; }
.mono { font-family: GeistMono, monospace; letter-spacing: .14em; text-transform: uppercase; }
#leg { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); width: 1120px; background: rgba(16,18,20,.94); border: 1px solid #2C3036; border-radius: 16px; padding: 14px 22px; font-size: 24px; font-weight: 600; line-height: 1.3; display: flex; gap: 16px; align-items: center; z-index: 5; }
#leg b { flex: none; background: #C6F135; color: #141619; border-radius: 50%; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; }
.atlas { position: absolute; left: 140px; top: 46px; width: 1000px; height: 520px; background: #141619; border: 1px solid #2C3036; border-radius: 18px; overflow: hidden; display: flex; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.lat { width: 230px; background: #101214; padding: 26px 22px; display: flex; flex-direction: column; gap: 18px; }
.lat .marca { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: .1em; }
.lat .marca img { width: 40px; }
.p { display: flex; align-items: center; gap: 12px; font-size: 16px; color: #B4BBB2; }
.p i { width: 28px; height: 28px; border-radius: 14px; background: #22262B; display: inline-flex; align-items: center; justify-content: center; font: 600 13px GeistMono; font-style: normal; }
.p.ok i, .p.agora i { background: #C6F135; color: #141619; }
.p.agora { color: #EDEFEA; font-weight: 700; }
.corpo { flex: 1; padding: 38px 40px; display: flex; flex-direction: column; gap: 16px; }
.corpo h1 { font-size: 36px; letter-spacing: -.02em; }
.txt { font-size: 18px; color: #B4BBB2; line-height: 1.5; }
.btn { height: 58px; padding: 0 28px; border-radius: 14px; background: #C6F135; color: #141619; font-weight: 700; font-size: 20px; display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; }
.nav { position: absolute; left: 150px; top: 34px; width: 980px; height: 540px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55); color: #1f1f1f; }
.topo { height: 54px; background: #E9EBEE; display: flex; align-items: center; gap: 9px; padding: 0 18px; }
.topo i { width: 13px; height: 13px; border-radius: 7px; background: #ED6A5E; display: inline-block; }
.topo i:nth-child(2) { background: #F4BF4F; } .topo i:nth-child(3) { background: #61C554; }
.url { margin-left: 16px; flex: 1; height: 34px; border-radius: 17px; background: #fff; display: flex; align-items: center; padding: 0 16px; font: 15px GeistMono; color: #444; }
.pag { height: calc(100% - 54px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #F7F5F0; }
.pag h2 { font-size: 32px; font-weight: 600; text-align: center; max-width: 660px; line-height: 1.25; }
.item { position: relative; width: 380px; height: 56px; border-radius: 12px; display: flex; align-items: center; padding: 0 18px; font-size: 19px; }
.item.botao { background: #fff; border: 1px solid #d0d4d9; justify-content: center; font-weight: 600; }
.item.botao.hl { background: #1f1f1f; color: #fff; border: 3px solid #C6F135; }
.item.campo { background: #fff; border: 1px solid #c4c8cd; color: #8a8f96; }
.item.campo.hl { border: 3px solid #C6F135; color: #1f1f1f; }
.dica { position: absolute; left: calc(100% + 14px); top: 50%; transform: translateY(-50%); background: #1B1E22; color: #C6F135; font-weight: 700; font-size: 16px; border-radius: 9px; padding: 7px 12px; white-space: nowrap; }
.trad { background: #C6F135; color: #141619; font-weight: 700; font-size: 17px; border-radius: 10px; padding: 8px 14px; }
.ok-grande { width: 96px; height: 96px; border-radius: 50%; background: #2F9E44; display: flex; align-items: center; justify-content: center; }
#cur { position: absolute; width: 34px; height: 34px; z-index: 9; transform-origin: 4px 4px; }
#anel { position: absolute; border-radius: 50%; border: 4px solid #C6F135; z-index: 8; opacity: 0; transform: translate(-50%, -50%); }
</style></head>
<body>
<div id="cenas"></div>
<div id="leg"><b id="legn">1</b><span id="legt"></span></div>
<svg id="cur" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.6L9.8 19z" fill="#fff" stroke="#141619" stroke-width="1.4" stroke-linejoin="round"/></svg>
<div id="anel"></div>
<script>
const $ = (id) => document.getElementById(id)
const cl = (x, a, b) => Math.max(a, Math.min(b, x))
const ease = (x) => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2
const fase = (t, a, b) => ease(cl((t - a) / (b - a), 0, 1))
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const ROTULO = { github: 'GitHub', supabase: 'Supabase', hosp: 'Vercel' }
const ETAPAS = ['A ideia', 'O visual', 'O nome', 'O protótipo', 'As contas', 'Começar']
const lateral = () => `<div class="lat"><span class="marca"><img src="monograma-fundo-escuro.png">ATLAS</span>${ETAPAS.map((e, i) => `<span class="p ${i < 4 ? 'ok' : i === 4 ? 'agora' : ''}"><i>${i < 4 ? '✓' : i + 1}</i>${e}</span>`).join('')}</div>`
// Monta as cenas a partir dos passos da conta (os mesmos da tela do Atlas, src/app/contas-passos.ts).
window.montar = (conta) => {
  const cenas = []
  let t = 0
  const add = (dur, html, extra) => { cenas.push({ a: t, b: t + dur, html, ...extra }); t += dur }
  add(4.5, `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 40%, rgba(198,241,53,.10), transparent 60%), #0f1113"><img src="monograma-fundo-escuro.png" style="width:110px"><span class="mono" style="color:#C6F135;font-size:18px">Atlas · passo a passo</span><h1 style="font-size:60px;letter-spacing:-.02em;text-align:center;line-height:1.1">Criar a conta do ${ROTULO[conta.id]}</h1><span style="font-size:24px;color:#B4BBB2;max-width:900px;text-align:center;line-height:1.4">${esc(conta.oque)} ${esc(conta.porque)}</span></div>`)
  conta.passos.forEach((p, i) => {
    const n = i + 1
    const leg = { n: String(n), txt: p.faca }
    if (i === 0) {
      add(6, `<div class="atlas">${lateral()}<div class="corpo"><span class="mono" style="font-size:13px;color:#8E968C">Conta · ${ROTULO[conta.id]}</span><h1>${esc(conta.oque)}</h1><span class="txt">${esc(conta.porque)}</span><span class="btn" data-alvo>Abrir o site →</span></div></div>`, { leg: { n: '1', txt: `No Atlas, clique em "Abrir o site". O site do ${ROTULO[conta.id]} abre para você.` }, clique: true })
    }
    if (!p.site.itens.length) {
      add(5, `<div class="nav"><div class="topo"><i></i><i></i><i></i><span class="url">${esc(p.site.url)}</span></div><div class="pag"><div class="ok-grande"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div><h2>${esc(p.site.titulo)}</h2></div></div>`, { leg })
      return
    }
    const alvo = p.site.itens.find((x) => x.destaque)
    const itens = p.site.itens.map((x) => `<div class="item ${x.tipo === 'campo' ? 'campo' : 'botao'} ${x.destaque ? 'hl' : ''}" ${x.destaque ? 'data-alvo' : ''}>${x.tipo === 'campo' && x.destaque ? '<span data-digita></span>' : esc(x.txt)}${x.destaque ? `<span class="dica" data-dica>${esc(x.dica || 'clique aqui')}</span>` : ''}</div>`).join('')
    const trad = p.en ? `<span class="trad" data-dica>${esc(p.en)} quer dizer "${esc(p.pt)}"</span>` : ''
    add(i === 0 ? 6 : 7, `<div class="nav"><div class="topo"><i></i><i></i><i></i><span class="url">${esc(p.site.url)}</span></div><div class="pag"><h2>${esc(p.site.titulo)}</h2>${itens}${trad}</div></div>`, { leg: i === 0 ? { n: '2', txt: `No site, clique em "${alvo ? alvo.txt : ''}".` } : { n: String(n + 1), txt: p.faca }, clique: true, digita: alvo && alvo.tipo === 'campo' ? alvo.txt : null })
  })
  const fim = conta.id === 'hosp' ? 'Pronto! As três contas estão criadas. Volte ao Atlas: ele percebe sozinho.' : 'Pronto! Volte ao Atlas: ele percebe sozinho e vai para a próxima conta.'
  add(5, `<div class="atlas">${lateral()}<div class="corpo"><span class="mono" style="font-size:13px;color:#8E968C">Conta · ${ROTULO[conta.id]}</span><h1>Conta criada!</h1><div style="display:flex;align-items:center;gap:14px;background:#1E2125;border:1px solid #2C3036;border-radius:16px;padding:20px;font-size:19px"><span style="width:34px;height:34px;border-radius:17px;background:#C6F135;color:#141619;display:inline-flex;align-items:center;justify-content:center;font-weight:800">✓</span>O Atlas viu sozinho: a sua conta do ${ROTULO[conta.id]} está pronta.</div></div></div>`, { leg: { n: '✓', txt: fim } })
  $('cenas').innerHTML = cenas.map((c, i) => `<div class="cena" id="s${i}">${c.html}</div>`).join('')
  window.CENAS = cenas
  return { total: t, cortes: cenas.map((c) => [c.a, c.b]) }
}
window.setT = (t) => {
  const cenas = window.CENAS
  let ativa = null
  cenas.forEach((c, i) => {
    const el = $(`s${i}`)
    el.style.opacity = Math.min(fase(t, c.a - .3, c.a + .3), 1 - fase(t, c.b - .3, c.b + .3))
    if (t >= c.a && t < c.b) ativa = { c, el }
  })
  const leg = ativa && ativa.c.leg
  $('leg').style.opacity = leg ? Math.min(fase(t, ativa.c.a + .2, ativa.c.a + .7), 1 - fase(t, ativa.c.b - .5, ativa.c.b)) : 0
  if (leg) { $('legn').textContent = leg.n; $('legt').textContent = leg.txt }
  const cur = $('cur'), anel = $('anel')
  cur.style.opacity = 0; anel.style.opacity = 0
  if (!ativa) return
  const { c, el } = ativa
  const d = t - c.a, dur = c.b - c.a
  el.querySelectorAll('[data-dica]').forEach((x) => { x.style.opacity = fase(d, 1, 1.6) })
  const dg = el.querySelector('[data-digita]')
  if (dg && c.digita) { const k = Math.floor(cl((d - 1.2) / 1.6, 0, 1) * c.digita.length); dg.textContent = c.digita.slice(0, k) + (d > 1.2 && d < 3 ? '|' : '') }
  const alvo = el.querySelector('[data-alvo]')
  if (!c.clique || !alvo) return
  const r = alvo.getBoundingClientRect()
  const x = r.left + r.width / 2, y = r.top + r.height / 2
  const clique = Math.min(3.6, dur - 1.6)
  const p = fase(d, 0.8, clique - .4)
  const px = 1050 + (x - 1050) * p, py = 640 + (y - 640) * p
  const aperta = d >= clique && d < clique + .18 ? .85 : 1
  cur.style.opacity = Math.min(fase(d, .3, .8), 1 - fase(d, dur - .6, dur - .2)); cur.style.left = px - 4 + 'px'; cur.style.top = py - 4 + 'px'; cur.style.transform = `scale(${aperta})`
  const k = (d - clique) / .7
  if (k >= 0 && k <= 1) { anel.style.opacity = 1 - k; anel.style.left = x + 'px'; anel.style.top = y + 'px'; const s = 20 + 70 * k; anel.style.width = s + 'px'; anel.style.height = s + 'px' }
  alvo.style.boxShadow = d >= clique - .6 && d < clique + 1.5 ? '0 0 0 7px rgba(198,241,53,.35)' : 'none'
}
</script></body></html>
